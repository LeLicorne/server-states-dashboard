version: "3.8"

services:
  # Site (démarré par deploy.sh une fois le .env généré)
  site:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID}
        VITE_ZABBIX_API_URL: ${VITE_ZABBIX_API_URL}
        VITE_ZABBIX_API_TOKEN: ${VITE_ZABBIX_API_TOKEN}
        VITE_ZABBIX_CPU_ITEM_ID: ${VITE_ZABBIX_CPU_ITEM_ID}
        VITE_ZABBIX_MEMORY_ITEM_ID: ${VITE_ZABBIX_MEMORY_ITEM_ID}
        VITE_ZABBIX_NET_IN_ITEM_ID: ${VITE_ZABBIX_NET_IN_ITEM_ID}
        VITE_ZABBIX_NET_OUT_ITEM_ID: ${VITE_ZABBIX_NET_OUT_ITEM_ID}
        VITE_ZABBIX_DISK_ITEM_ID: ${VITE_ZABBIX_DISK_ITEM_ID}
        VITE_ZABBIX_PING_ITEM_ID: ${VITE_ZABBIX_PING_ITEM_ID}
    container_name: site
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - zabbix-network

  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: zabbix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_password
      POSTGRES_DB: zabbix
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - zabbix-network

  # Serveur Zabbix
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-latest
    container_name: zabbix-server
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_password
      POSTGRES_DB: zabbix
      ZBX_ENABLE_SNMP_TRAPS: "true"
    ports:
      - "10051:10051"
    volumes:
      - zabbix-server-data:/var/lib/zabbix
    depends_on:
      - postgres
    networks:
      - zabbix-network

  # Interface Web Zabbix
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-latest
    container_name: zabbix-web
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_password
      POSTGRES_DB: zabbix
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: Europe/Paris
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - zabbix-server
    networks:
      - zabbix-network

  # Agent Zabbix (optionnel, pour monitorer le serveur Docker lui-même)
  zabbix-agent:
    image: zabbix/zabbix-agent:alpine-latest
    container_name: zabbix-agent
    restart: unless-stopped
    environment:
      ZBX_HOSTNAME: "Zabbix server"
      ZBX_SERVER_HOST: zabbix-server
    ports:
      - "10050:10050"
    depends_on:
      - zabbix-server
    networks:
      - zabbix-network

networks:
  zabbix-network:
    driver: bridge

volumes:
  postgres-data:
  zabbix-server-data:
