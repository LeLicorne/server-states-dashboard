name: Build then Deploy to Production
################################################################################
# This action will build and push a Docker image to Docker Hub and deploy it to
# a VPS. It will also set up an OpenVPN connection to the VPS.
#
#  -------------------------- /!\ Important Notes /!\ --------------------------
# 
# - The Docker container will be named based on the format:
#   `${{ github.repository_owner }}-${{ github.event.repository.name }}-container`.
# - There is an Apache2 VHost behind the VPS's associated domains that will
#   reverse proxy to the Docker container.
# - There is also a systemd service that will restart the Docker container if 
#   it crashes.
#
# So any update on application ports must be reflected in the VHost and
# systemd service configuration files.
#  --------------------------- /!\ Required Creds /!\ --------------------------
# 
# - DOCKER_USERNAME: Docker Hub username
# - DOCKER_PASSWORD: Docker Hub password
# - SSH_USER: SSH username
# - SSH_PASSWORD: SSH password
# - SSH_PORT: SSH port
# - SSH_IP_ADDR: SSH IP address
# - ENV_FILE_PROD: Production Env File
################################################################################

on:
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Env to deploy'
        required: true
        type: choice
        options:
          - prod
      version:
        description: 'The  version to deploy'
        required: true
        type: string
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Prepare Docker metadata
        run: |
          echo "DOCKER_IMAGE=$(echo '${{ secrets.DOCKER_USERNAME }}/${{ github.repository_owner }}-${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}